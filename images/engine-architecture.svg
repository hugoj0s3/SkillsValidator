<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="625" viewBox="0 0 1250 625">
<defs>
  <!-- Arrow Markers -->
  <marker id="ab" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#3b82f6"/>
  </marker>
  <marker id="ap" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#8b5cf6"/>
  </marker>
  <marker id="ar" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#f97316"/>
  </marker>
  <marker id="ag" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#10b981"/>
  </marker>
  <marker id="ac" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#06b6d4"/>
  </marker>

  <filter id="sh">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
  </filter>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="14" cy="14" r="0.7" fill="#ffffff0d"/>
  </pattern>
</defs>

<!-- Background Grid -->
<rect width="1250" height="625" fill="#09111f"/>
<rect width="1250" height="625" fill="url(#dots)"/>

<!-- Header -->
<text x="625" y="38" fill="#f8fafc" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="0.5">Skills Validator — Interview Engine</text>
<text x="625" y="58" fill="#94a3b8" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" text-anchor="middle">The engine talks only to interfaces: audio travels over one WebSocket, AI and speech providers are swappable projects</text>
<line x1="60" y1="72" x2="1190" y2="72" stroke="#1e3a8a" stroke-width="1.2" opacity="0.6"/>

<!-- ═══════════════════ BOUNDARIES ═══════════════════ -->

<!-- Engine boundary -->
<rect x="320" y="92" width="895" height="308" rx="10" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="336" y="113" fill="#cbd5e1" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="800">SkillsValidator.Engine <tspan fill="#64748b" font-weight="normal">— depends only on its own interfaces</tspan></text>

<!-- Providers boundary -->
<rect x="320" y="425" width="895" height="180" rx="10" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="336" y="590" fill="#cbd5e1" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="800">Providers <tspan fill="#64748b" font-weight="normal">— one project each, swappable</tspan></text>

<!-- ═══════════════════ ROW 1: BROWSER → CHANNEL → RUNNER → SESSIONS ═══════════════════ -->

<!-- 1. Browser -->
<g filter="url(#sh)">
  <rect x="30" y="135" width="220" height="100" rx="8" fill="#0c1d38" stroke="#1e4080" stroke-width="1.5"/>
  <rect x="30" y="135" width="220" height="4" rx="2" fill="#3b82f6"/>
  <!-- Window icon -->
  <rect x="45" y="157" width="22" height="16" rx="2" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="45" y1="162" x2="67" y2="162" stroke="#60a5fa" stroke-width="1.2"/>
  <circle cx="49" cy="159.5" r="1" fill="#60a5fa"/>
  <circle cx="53" cy="159.5" r="1" fill="#60a5fa"/>
  <text x="78" y="165" fill="#60a5fa" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="800">Browser</text>
  <text x="78" y="185" fill="#93c5fd" font-family="Arial" font-size="11" font-weight="bold">&lt;voice-panel&gt; (JavaScript)</text>
  <text x="78" y="203" fill="#eff6ff" font-family="Arial" font-size="10.5">microphone · speaker</text>
  <text x="78" y="221" fill="#60a5fa" font-family="Arial" font-size="9.5" opacity="0.9">one WebSocket per interview</text>
</g>

<!-- 2. IAudioChannel -->
<g filter="url(#sh)">
  <rect x="340" y="135" width="240" height="100" rx="8" fill="#120830" stroke="#6d28d9" stroke-width="1.5"/>
  <rect x="340" y="135" width="240" height="4" rx="2" fill="#8b5cf6"/>
  <!-- Two-way pipe icon -->
  <path d="M 355,160 H 377 M 372,155 L 377,160 L 372,165" stroke="#a78bfa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 377,171 H 355 M 360,166 L 355,171 L 360,176" stroke="#a78bfa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="388" y="165" fill="#c4b5fd" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="800">IAudioChannel</text>
  <text x="388" y="185" fill="#a78bfa" font-family="Arial" font-size="11" font-weight="bold">The pipe to the browser</text>
  <text x="388" y="203" fill="#e9d5ff" font-family="Arial" font-size="10.5">WebSocketAudioChannel</text>
  <text x="388" y="221" fill="#a78bfa" font-family="Arial" font-size="9.5" opacity="0.9">mic in · voice out · stop</text>
</g>

<!-- 3. IRealtimeInterviewRunner (the conductor) -->
<g filter="url(#sh)">
  <rect x="640" y="135" width="240" height="100" rx="8" fill="#2d1502" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="640" y="135" width="240" height="4" rx="2" fill="#f97316"/>
  <!-- Loop icon -->
  <path d="M 673,160 A 9 9 0 1 0 666,174" fill="none" stroke="#fdb574" stroke-width="1.6" stroke-linecap="round"/>
  <polygon points="669,155 676,160 668,164" fill="#f97316"/>
  <text x="688" y="165" fill="#fed7aa" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="800">IRealtimeInterviewRunner</text>
  <text x="688" y="185" fill="#f97316" font-family="Arial" font-size="11" font-weight="bold">The conversation loop</text>
  <text x="688" y="203" fill="#fff7ed" font-family="Arial" font-size="10.5">listens · interrupts · answers</text>
  <text x="688" y="221" fill="#fdb874" font-family="Arial" font-size="9.5" opacity="0.9">replies sentence by sentence</text>
</g>

<!-- 4. ISessionInterviewService -->
<g filter="url(#sh)">
  <rect x="950" y="135" width="240" height="100" rx="8" fill="#091d3d" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="950" y="135" width="240" height="4" rx="2" fill="#3b82f6"/>
  <!-- Clipboard icon -->
  <rect x="966" y="155" width="18" height="22" rx="2" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="971" y="152" width="8" height="5" rx="1" fill="#3b82f6"/>
  <line x1="970" y1="164" x2="980" y2="164" stroke="#60a5fa" stroke-width="1.2"/>
  <line x1="970" y1="169" x2="978" y2="169" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="998" y="165" fill="#93c5fd" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="800">ISessionInterviewService</text>
  <text x="998" y="185" fill="#3b82f6" font-family="Arial" font-size="11" font-weight="bold">Sessions &amp; reports</text>
  <text x="998" y="203" fill="#eff6ff" font-family="Arial" font-size="10.5">Running → Finished → Reported</text>
  <text x="998" y="221" fill="#60a5fa" font-family="Arial" font-size="9.5" opacity="0.9">evaluation starts on finish</text>
</g>

<!-- ═══════════════════ ROW 2: STORAGE ═══════════════════ -->

<!-- 5. Repositories -->
<g filter="url(#sh)">
  <rect x="950" y="285" width="240" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="950" y="285" width="240" height="4" rx="2" fill="#64748b"/>
  <!-- Database cylinder icon -->
  <path d="M 966,310 C 966,305 982,305 982,310 L 982,326 C 982,331 966,331 966,326 Z" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 966,315 C 966,320 982,320 982,315" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 966,321 C 966,326 982,326 982,321" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="998" y="315" fill="#e2e8f0" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="800">Repositories</text>
  <text x="998" y="335" fill="#94a3b8" font-family="Arial" font-size="11" font-weight="bold">Skills: JSON files (read-only)</text>
  <text x="998" y="353" fill="#f1f5f9" font-family="Arial" font-size="10.5">sessions, transcripts, reports</text>
  <text x="998" y="371" fill="#94a3b8" font-family="Arial" font-size="9.5" opacity="0.9">kept in memory (no database)</text>
</g>

<!-- ═══════════════════ ROW 3: PROVIDERS ═══════════════════ -->

<!-- 6. ISpeechConverter -->
<g filter="url(#sh)">
  <rect x="340" y="460" width="240" height="100" rx="8" fill="#022c22" stroke="#059669" stroke-width="1.5"/>
  <rect x="340" y="460" width="240" height="4" rx="2" fill="#10b981"/>
  <!-- Waveform icon -->
  <path d="M 356,490 V 496 M 361,485 V 501 M 366,480 V 506 M 371,486 V 500 M 376,490 V 496" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  <text x="388" y="490" fill="#a7f3d0" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="800">ISpeechConverter</text>
  <text x="388" y="510" fill="#34d399" font-family="Arial" font-size="11" font-weight="bold">Hearing &amp; speaking</text>
  <text x="388" y="528" fill="#ecfdf5" font-family="Arial" font-size="10.5">speech-to-text · text-to-speech</text>
  <text x="388" y="546" fill="#6ee7b7" font-family="Arial" font-size="9.5" font-weight="bold">Engine.AzureSpeech → Azure Speech</text>
</g>

<!-- 7. IRealtimeInterviewAgent -->
<g filter="url(#sh)">
  <rect x="640" y="460" width="240" height="100" rx="8" fill="#062a33" stroke="#0891b2" stroke-width="1.5"/>
  <rect x="640" y="460" width="240" height="4" rx="2" fill="#06b6d4"/>
  <!-- Chat bubble icon -->
  <path d="M 656,481 H 678 A 3 3 0 0 1 681,484 V 495 A 3 3 0 0 1 678,498 H 665 L 659,503 V 498 H 656 A 3 3 0 0 1 653,495 V 484 A 3 3 0 0 1 656,481 Z" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="661" cy="490" r="1.3" fill="#22d3ee"/>
  <circle cx="667" cy="490" r="1.3" fill="#22d3ee"/>
  <circle cx="673" cy="490" r="1.3" fill="#22d3ee"/>
  <text x="688" y="490" fill="#a5f3fc" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="800">IRealtimeInterviewAgent</text>
  <text x="688" y="510" fill="#22d3ee" font-family="Arial" font-size="11" font-weight="bold">The interviewer</text>
  <text x="688" y="528" fill="#ecfeff" font-family="Arial" font-size="10.5">streams its next reply</text>
  <text x="688" y="546" fill="#67e8f9" font-family="Arial" font-size="9.5" font-weight="bold">Engine.OpenAI → OpenAI</text>
</g>

<!-- 8. IReportEvaluator -->
<g filter="url(#sh)">
  <rect x="950" y="460" width="240" height="100" rx="8" fill="#062a33" stroke="#0891b2" stroke-width="1.5"/>
  <rect x="950" y="460" width="240" height="4" rx="2" fill="#06b6d4"/>
  <!-- Check icon -->
  <circle cx="975" cy="490" r="10" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
  <path d="M 970,490 L 974,494 L 981,486" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="998" y="490" fill="#a5f3fc" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="800">IReportEvaluator</text>
  <text x="998" y="510" fill="#22d3ee" font-family="Arial" font-size="11" font-weight="bold">The report agent</text>
  <text x="998" y="528" fill="#ecfeff" font-family="Arial" font-size="10.5">score · label · summary</text>
  <text x="998" y="546" fill="#67e8f9" font-family="Arial" font-size="9.5" font-weight="bold">Engine.OpenAI → OpenAI</text>
</g>

<!-- ═══════════════════ FLOWS ═══════════════════ -->

<!-- Browser ⇄ IAudioChannel (WebSocket) -->
<text x="295" y="150" fill="#e2e8f0" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">WebSocket</text>
<line x1="250" y1="172" x2="332" y2="172" stroke="#3b82f6" stroke-width="2.2" marker-end="url(#ab)"/>
<text x="295" y="166" fill="#93c5fd" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">mic audio</text>
<line x1="340" y1="202" x2="258" y2="202" stroke="#8b5cf6" stroke-width="2.2" marker-end="url(#ap)"/>
<text x="295" y="218" fill="#c4b5fd" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">voice · events</text>

<!-- IAudioChannel ⇄ Runner -->
<line x1="580" y1="172" x2="632" y2="172" stroke="#8b5cf6" stroke-width="2.2" marker-end="url(#ap)"/>
<text x="610" y="166" fill="#c4b5fd" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">audio</text>
<line x1="640" y1="202" x2="588" y2="202" stroke="#f97316" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="610" y="218" fill="#fed7aa" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">voice</text>

<!-- Runner → ISessionInterviewService -->
<line x1="880" y1="185" x2="942" y2="185" stroke="#f97316" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="915" y="178" fill="#fed7aa" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">transcript</text>
<text x="915" y="200" fill="#fed7aa" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">finish</text>

<!-- ISessionInterviewService → Repositories -->
<line x1="1070" y1="235" x2="1070" y2="277" stroke="#64748b" stroke-width="2" marker-end="url(#ab)"/>
<text x="1080" y="261" fill="#94a3b8" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" font-weight="bold" text-anchor="start">store</text>

<!-- Runner → ISpeechConverter -->
<path d="M 700,235 V 330 H 460 V 452" fill="none" stroke="#10b981" stroke-width="2.2" marker-end="url(#ag)"/>
<text x="580" y="322" fill="#6ee7b7" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">hear · speak</text>

<!-- Runner → IRealtimeInterviewAgent -->
<line x1="820" y1="235" x2="820" y2="452" stroke="#06b6d4" stroke-width="2.2" marker-end="url(#ac)"/>
<text x="830" y="342" fill="#67e8f9" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="bold" text-anchor="start">conversation</text>
<text x="830" y="357" fill="#67e8f9" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="bold" text-anchor="start">→ reply</text>

<!-- ISessionInterviewService → IReportEvaluator -->
<path d="M 1190,210 H 1228 V 510 H 1198" fill="none" stroke="#06b6d4" stroke-width="2.2" marker-end="url(#ac)"/>
<text x="1240" y="360" transform="rotate(90 1240,360)" fill="#67e8f9" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">evaluate on finish</text>

</svg>
